eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  // Nullable注解 (JSR-305)
  implementation 'com.google.code.findbugs:jsr305:3.0.2'

  // 手柄
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"

  // 跨平台文件选择器
  implementation "games.spooky.gdx:gdx-nativefilechooser:$gdxNativefilechooserVersion"

  // FastJSON 依赖
  implementation 'com.alibaba:fastjson:1.2.83'
  implementation 'com.alibaba:fastjson:1.1.72.android' // 如果使用 Android，可能需要添加这个

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
    implementation "com.badlogicgames.gdx:gdx-contrib-gif:1.0.0"
  }

  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
  useJUnitPlatform()
}
